<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Kanghoo</title>
    <link rel="stylesheet" href="../assets/css/bundle.min.css">
    <script src="/api/config.js"></script>
</head>
<body class="form-page">
    <main class="form-container">
        <h1 id="welcome-message">Carregando...</h1>
        <p>Você está em uma área segura da aplicação.</p>
        <div class="botoes-acao" style="justify-content: center; margin-top: 2rem;">
            <button id="logout-button" class="btn btn-logout">Sair (Logout)</button>
        </div>
    </main>
<script>
document.addEventListener("DOMContentLoaded", async () => {
    const token = localStorage.getItem("authToken");
    const apiBase = (window.APP_CONFIG?.apiBasePath) || "/api";
    if (!token) {
        if (!window.APP_CONFIG?.demoMode) {
            window.location.href = "login.html";
            return;
        }
    }
    const payload = token ? JSON.parse(atob(token.split(".")[1])) : { tipo: "demo" };
    if (payload.tipo === "motorista_escolar" || payload.tipo === "motorista_escolar_excursao") {
        window.location.href = "area-motorista-escolar.html";
        return;
    } else if (payload.tipo === "motorista_excursao" || payload.tipo === "motorista_escolar_excursao") {
        window.location.href = "area-motorista-excursao.html";
        return;
    } else if (payload.tipo === "responsavel") {
        window.location.href = "area-responsavel.html";
        return;
    }
    document.getElementById("welcome-message").textContent = "Modo demonstra��o - escolha seu perfil";
});
</script>
