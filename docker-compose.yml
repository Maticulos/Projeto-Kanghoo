version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kanghoo-postgres
    environment:
      POSTGRES_DB: kanghoo_db_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: node:24-alpine
    container_name: kanghoo-app
    working_dir: /app/server
    command: sh -c "npm install && npm start"
    ports:
      - "5000:5000"
      - "8080:8080"
    volumes:
      - ./:/app
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=kanghoo_db_prod
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - PORT=5000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
