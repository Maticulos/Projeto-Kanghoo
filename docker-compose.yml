version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kanghoo-postgres
    environment:
      POSTGRES_DB: kanghoo_db_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transporte-network

  redis:
    image: redis:7-alpine
    container_name: kanghoo-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis_password_123
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transporte-network

  app:
    image: node:24-alpine
    container_name: kanghoo-app
    working_dir: /app/server
    command: sh -c "npm install && npm start"
    ports:
      - "5000:5000"
      - "8080:8080"
    volumes:
      - ./:/app
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=kanghoo_db_prod
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_password_123
      - PORT=5000
      - NODE_ENV=development
      - JWT_SECRET=sua_chave_secreta_jwt_muito_segura_com_pelo_menos_32_caracteres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - transporte-network

  nginx:
    image: nginx:alpine
    container_name: kanghoo-nginx
    ports:
      - "3000:80"
    volumes:
      - ./frontend/public:/usr/share/nginx/html
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - transporte-network

volumes:
  postgres_data:

networks:
  transporte-network:
    driver: bridge
